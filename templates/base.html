<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rahma Groups ERP{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">Rahma Groups ERP</a>
    {% if request.user.is_authenticated %}
    <div class="d-flex align-items-center gap-3 text-white">
      <span>{{ request.user.username }} · {{ request.user.get_role_display }}</span>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}<button class="btn btn-outline-light btn-sm">Log out</button>
      </form>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container-fluid p-4">
  {% if messages %}{% for message in messages %}
  <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
  {% endfor %}{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
